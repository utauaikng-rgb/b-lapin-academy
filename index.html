{title:'第1章　春の出会い',place:'桜の学園中庭',narr:'転入したあなたは、'+p.name+'と出会う。'+r[1],quote:'「満月祭の準備、手伝ってくれない？」',opts:[['相手の夢を詳しく聞く',12],['自分の夢も話す',9],['まずは見学する',5]]},
{title:'第2章　ふたりの放課後',place:r[2],narr:'放課後、'+r[2]+'で一緒に練習することに。少しずつ距離が縮まっていく。',quote:'「'+r[4]+'」',opts:[['一緒に練習を重ねる',12],['素直に感想を伝える',10],['そっと見守る',5]]},
{title:'第3章　夢の壁',place:'芸能科・特別レッスン',narr:r[3]+'あなたならどう支える？',quote:'「夢を追うって、思ったより難しいね……」',opts:[['本人の考えを尊重して支える',14],['別の方法を一緒に考える',11],['少し休むよう勧める',7]]},
{title:'第4章　すれ違う想い',place:'月明かりの回廊',narr:'本番が近づき、忙しさからすれ違いが生まれる。伝えられなかった言葉が胸に残る。',quote:'「君にだけは、誤解されたくなかった」',opts:[['本音を聞いて自分の気持ちも伝える',14],['手紙に想いを託す',11],['今は時間を置く',5]]},
{title:'第5章　満月祭の舞台',place:'学園・満月祭メインステージ',narr:r[0]+'として迎える大舞台。舞台袖であなたの声を待っている。',quote:'「君がいてくれたから、ここまで来られた」',opts:[['夢も気持ちも応援すると伝える',15],['最高の舞台にしようと励ます',11],['笑顔で送り出す',7]]}
];return {r,scene:phases[Math.min(chapter,4)]}}
function render(){document.getElementById('visual-home').classList.toggle('active',tab==='home');let p=all[selected];if(tab==='home'){hero.innerHTML=initial;$('start').onclick=()=>nav('members');return}

if(tab==='pets'){showPanel('<h2>🐾 月夜のもふもふクラブ</h2><p class="hint">学園のペットたちと仲良くなろう。恋愛ゲーム風の「なかよしルート」です。</p><div class="grid">'+DATA.pets.map((x,i)=>'<button class="card" data-pet="'+i+'"><img src="'+x.img+'"><b>'+escapeHTML(x.name)+'</b><small>'+(i===0?'キュ〜キュ〜 ♡ 砂肝ルート':i===1?'わんわん ♡ ふわふわ遊び':'わんわん ♡ おもちゃ遊び')+'</small></button>').join('')+'</div>');hero.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>choose(DATA.people.length+1+(+b.dataset.pet)));return}
if(tab==='petstory'){
 const pi=DATA.pets.findIndex(x=>x.name===p.name);if(pi<0){nav('pets');return}
 const stage=petDays[pi],hearts=petHearts[pi],isPote=pi===0;
 const locations=isPote?['月うさぎの温室','放課後のふれあい室','月明かりの中庭','学園の休憩室','満月のテラス']:pi===1?['桜の中庭','ふわふわドッグラン','校舎のテラス','芝生の広場','満月の庭']:['おもちゃ部屋','学園の中庭','かくれんぼ広場','夕暮れのテラス','満月のドッグラン'];
 const activity=pi===1?['まろんがふわふわの毛を揺らして駆け寄ってきた。','まろんはボールを見つめて、遊んでほしそう。','まろんはあなたの隣でくつろいでいる。','まろんがリボンをつけてお散歩を待っている。','まろんは満月の下で楽しそうにしっぽを振る。']:['コロンがおもちゃをくわえてやってきた。','コロンはかくれんぼの準備万端！','コロンは小さなボールを追いかけている。','コロンは一緒に走りたそうにしている。','コロンは満月の下でぴょんぴょん跳ねている。'];
 if(stage>=5){showPanel('<div class="petroute"><div class="petlabel">MOONLIGHT PET ENDING ✦</div><h2>🌕 '+escapeHTML(p.name)+'との満月エンド</h2><div class="profile"><img src="'+p.img+'"><div><div class="dialog">'+(isPote?'「キュ〜キュ〜」':'「わんわん！」')+'</div><p>なかよし度 '+hearts+' ♡　'+(isPote?'今日も砂肝が大好きなぽてころもち。':'一緒に遊んだ思い出がいっぱい！')+'</p><button class="cta" id="petagain">もう一度ふれあう ♡</button></div></div></div>');hero.querySelector('#petagain').onclick=()=>{petDays[pi]=0;petHearts[pi]=0;render()};return}
 const sceneText=isPote?'ぽてころもちがこちらを見つめている。小さな声が響いた。':activity[stage];
 const buttons=isPote?[['砂肝をあげる',15]]:pi===1?[['ボールで遊ぶ',15],['ブラッシングしてあげる',12],['一緒にお散歩する',10]]:[['おもちゃで遊ぶ',15],['かくれんぼする',12],['一緒に走る',10]];
 showPanel('<div class="petroute"><div class="petlabel">PET LOVE STORY · '+(stage+1)+'/5</div><h2>♡ '+escapeHTML(p.name)+'と恋するような放課後</h2><div class="petstats">'+(hearts>=45?'🌕':hearts>=25?'🌓':'🌙')+' なかよし度 '+hearts+' ♡　｜　'+locations[stage]+'</div><div class="bar"><i style="width:'+Math.min(100,hearts/75*100)+'%"></i></div><div class="profile"><img src="'+p.img+'"><div><p class="petnarr">'+sceneText+'</p><div class="dialog"><b>'+escapeHTML(p.name)+'</b><br>「'+(isPote?'キュ〜キュ〜':'わんわん！')+'」</div><div class="choices">'+buttons.map((o,i)=>'<button data-petchoice="'+i+'">♡ '+o[0]+'</button>').join('')+'</div><p class="hint">※ペットとの恋愛は、かわいがって仲良くなるファンタジー表現です。</p></div></div></div>');hero.querySelectorAll('[data-petchoice]').forEach(b=>b.onclick=()=>{petHearts[pi]+=buttons[+b.dataset.petchoice][1];petDays[pi]++;render()});return}
